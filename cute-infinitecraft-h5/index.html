<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>萌萌合成 - H5</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app" class="app">
      <header class="topbar">
        <div class="brand">
          <div class="brand__logo" aria-hidden="true">★</div>
          <div class="brand__text">
            <div class="brand__title">萌萌合成</div>
            <div class="brand__sub">金木水火土 · 拖拽合成</div>
          </div>
        </div>
        <div class="topbar__actions">
          <button id="btnUndo" class="btn btn--ghost" title="撤销">撤销</button>
          <button id="btnTidy" class="btn btn--ghost" title="整理画布">整理</button>
          <button id="btnClear" class="btn btn--danger" title="清空画布">清空</button>
          <button id="btnExport" class="btn" title="导出存档">导出</button>
          <label class="btn btn--ghost fileBtn" title="导入存档">
            导入
            <input id="fileImport" type="file" accept="application/json" />
          </label>
          <button id="btnMusic" class="btn btn--ghost" title="背景音乐">🎵</button>
          <button id="btnHelp" class="btn btn--ghost" title="说明">说明</button>
        </div>
      </header>

      <main class="main">
        <aside class="panel panel--left">
          <div class="panel__header">
            <div class="panel__title">元素库</div>
            <div class="panel__meta">
              <span id="unlockedCount">0</span>/<span id="totalCount">0</span>
            </div>
          </div>
          <div class="panel__controls">
            <input id="searchInput" class="input" placeholder="搜索元素…" autocomplete="off" />
            <select id="sortSelect" class="select" title="排序">
              <option value="recent">最近解锁</option>
              <option value="name">名称</option>
              <option value="rare">稀有度</option>
            </select>
          </div>
          <div id="library" class="library" aria-label="已解锁元素列表"></div>
        </aside>

        <section class="boardWrap">
          <div class="boardTop">
            <div class="tips" id="tips">
              从左侧拖一个元素到画布；再把它拖到另一个元素上试试～
            </div>
            <div class="boardStats">
              <span class="pill">配方：<span id="recipeCount">0</span>+</span>
              <span class="pill">画布：<span id="itemCount">0</span></span>
            </div>
          </div>
          <div id="board" class="board" aria-label="合成画布"></div>
        </section>

        <aside class="panel panel--right">
          <div class="panel__header">
            <div class="panel__title">喵喵店铺</div>
            <div class="panel__meta">
              <span class="tag">金币 <span id="coinCount">0</span></span>
              <span class="tag">家园 Lv.<span id="homeLevel">1</span></span>
            </div>
          </div>

          <div class="rightBody">
            <div class="card">
              <div class="card__title">今日订单</div>
              <div id="orders" class="list"></div>
            </div>

            <div class="card">
              <div class="card__title">每日任务</div>
              <div id="dailyTasks" class="list"></div>
            </div>

            <div class="card">
              <div class="card__title">家园装饰</div>
              <div class="muted" style="margin:6px 0 8px">购买装饰会提升家园氛围（后续可扩展为外观展示）。</div>
              <div id="decors" class="list"></div>
            </div>
          </div>
        </aside>
      </main>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>

      <dialog id="helpDialog" class="dialog">
        <form method="dialog" class="dialog__content">
          <div class="dialog__title">玩法说明</div>
          <div class="dialog__body">
            <ul class="helpList">
              <li><b>拖拽</b>：从元素库拖到画布生成贴纸。</li>
              <li><b>合成</b>：把一个贴纸拖到另一个贴纸上，命中配方就会解锁新元素。</li>
              <li><b>撤销</b>：撤销上一次合成（仅最近一步）。</li>
              <li><b>存档</b>：自动本地保存；也可导入/导出 JSON。</li>
            </ul>
            <p class="muted">
              说明：这是离线内置配方版本（不接AI）。未命中时会尝试若干内置“通用规则”，让玩法更接近无限扩展。
            </p>
          </div>
          <div class="dialog__actions">
            <button class="btn" value="ok">知道啦</button>
          </div>
        </form>
      </dialog>
    </div>

    <!-- 为了支持直接双击 index.html（file://）运行，这里使用无模块的单文件脚本 -->
    <script src="./app.js"></script>
  </body>
</html>
